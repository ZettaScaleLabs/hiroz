  # ---------------------------------------------------------------------------
  # TEMPORARY — REVERT BEFORE MERGE.
  #
  # release.yml runs only on `push: tags: v*`, so the macOS smoke leg added to
  # it cannot be exercised by a pull request. Its first execution would be a
  # real release, which is the wrong place to discover that the macOS tarball
  # does not install.
  #
  # This runs the SAME scripts on the same runner OS, so the path is measured
  # once here instead. It is deliberately allowed to fail the run: a red job is
  # the finding. Delete this block once the result has been read.
  # ---------------------------------------------------------------------------
  macos-release-smoke-temporary:
    name: TEMPORARY macOS release smoke
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # dtolnay/rust-toolchain, NOT actions-rust-lang/setup-rust-toolchain.
      # release.yml uses this one, and only this one accepts `targets` (plural).
      # The other takes `target`, so it drops `targets` with a WARNING rather
      # than an error, and the wasm build then fails with "can't find crate for
      # `core`" -- which reads as a toolchain problem, not a typo'd input.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # Same action and pin release.yml uses, so this tests that too.
      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.113.1"

      # The real packaging script, with the tag-vs-crate guard armed. A host
      # build on macos-latest is a native aarch64-apple-darwin build, which is
      # exactly what the release leg produces.
      - name: Package the release artifacts
        run: nu scripts/build-hu-release.nu --version 0.1.0 --out dist

      - name: Show what was produced
        run: ls -l dist

      # The real installer, taking the Darwin/arm64 path through detect_target
      # and the shasum fallback through sha256_of. No --target is passed, so a
      # wrong detection shows up as a missing tarball rather than silently
      # installing the wrong one.
      - name: Install exactly as a user would
        run: |
          set -e
          HUHOME="$RUNNER_TEMP/huhome"
          mkdir -p "$HUHOME"
          HOME="$HUHOME" HU_PREFIX="$HUHOME/.local" sh scripts/install-hu.sh --offline dist
          echo "HUHOME=$HUHOME" >> "$GITHUB_ENV"

      # Running it is the point: a tarball that unpacks but whose binary will
      # not execute would pass every check above.
      - name: Run the installed binary and find its plugins
        run: |
          set -e
          export HOME="$HUHOME"
          export PATH="$HUHOME/.local/bin:$PATH"
          unset HU_PLUGIN_PATH
          hu --version
          hu plugin list
          hu plugin list | grep -q meter || { echo "FAIL: meter plugin not discovered"; exit 1; }
          hu plugin list | grep -q monitor || { echo "FAIL: monitor plugin not discovered"; exit 1; }
          echo "ok — macOS binary runs and discovers both plugins"

      - name: A corrupted asset must be refused
        run: |
          set -e
          tarball=$(echo dist/hu-*-aarch64-apple-darwin.tar.gz)
          test -f "$tarball" || { echo "FAIL: no macOS tarball in dist"; exit 1; }
          printf 'X' | dd of="$tarball" bs=1 seek=100 conv=notrunc 2>/dev/null
          BAD="$RUNNER_TEMP/huhome-bad"
          mkdir -p "$BAD"
          if HOME="$BAD" HU_PREFIX="$BAD/.local" sh scripts/install-hu.sh --offline dist; then
            echo "FAIL: installer accepted a corrupted tarball"; exit 1
          fi
          test ! -e "$BAD/.local/bin/hu" || { echo "FAIL: installed despite refusing"; exit 1; }
          echo "ok — corrupted asset refused on macOS"
