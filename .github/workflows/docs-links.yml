name: Docs — External Link Check

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  check_links:
    name: Check external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31

      - name: Build MkDocs
        run: nix develop '.#pureRust-ci' -c mkdocs build --strict

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/site
            --exclude-path ${{ github.workspace }}/site/overrides
            --config .lychee.toml
            ./site
          fail: false  # report only — don't block on transient failures

      - name: Open issue on link failures
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd  # v5
        with:
          title: 'docs: broken external links detected'
          content-filepath: ./lychee/out.md
          labels: documentation
