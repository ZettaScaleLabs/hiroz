name: Docs

on:
  push:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
      - '.github/workflows/docs.yml'

jobs:
  build_doc:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31

      - name: Build MkDocs
        run: |
          sed -i 's|^site_url:.*|site_url: http://localhost/|' mkdocs.yml
          nix develop '.#pureRust-ci' -c mkdocs build --strict

      - name: Check example documentation coverage
        run: |
          nix develop '.#pureRust-ci' -c nu scripts/check-example-coverage.nu

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/site
            --exclude-path ${{ github.workspace }}/site/overrides
            --config .lychee.toml
            ./site
          fail: true

  publish_doc:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build_doc
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31

      - name: Build MkDocs
        run: |
          nix develop '.#pureRust-ci' -c mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          clean_exclude: pr-preview/
          force_orphan: false
