name: PR Draft Notify

# Posts the policy warning and the welcome comment on external pull requests,
# including pull requests from forks.
#
# Trust boundary. pull_request_target runs this file from the base branch with
# a token that can write to pull requests, so nothing the pull request
# controls may run here:
#   - the only checkout is the base commit (never the head, never the merge ref),
#     sparse, without persisted credentials;
#   - the script reads the pull request only through context.payload, as data;
#   - no expression from the event is interpolated into a script or a command.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

# One run per pull request at a time, so two runs cannot both find no warning.
concurrency:
  group: pr-draft-notify-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify External Contributor
    runs-on: ubuntu-latest
    # createComment on a pull request needs pull-requests: write (or
    # issues: write); the same permission covers listReviews and listComments.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the policy script from the base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post the warning and welcome comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const { run } = require('./.github/scripts/pr-draft-check.js');
            // The verdict belongs to pr-draft-check.yml, so this job does not
            // repeat it. A failed post becomes a warning annotation.
            await run({ github, context, core }, { notify: true, failOnViolation: false });
