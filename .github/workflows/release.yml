name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-msgs:
    name: Build hiroz-msgs-py wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Python message types
        run: cargo build -p hiroz-msgs --features python_registry -j4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        working-directory: crates/hiroz-msgs/python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiroz-msgs-py-dist
          path: crates/hiroz-msgs/python/dist/*

  build-wheels:
    name: Build hiroz-py (${{ matrix.distro }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            distro: jazzy
            extra_args: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            distro: humble
            extra_args: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            distro: jazzy
            # --zig uses cargo-zigbuild for cross-compilation; handles ring's C assembly
            extra_args: "--zig"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            distro: humble
            extra_args: "--zig"
          - target: aarch64-apple-darwin
            os: macos-latest
            distro: jazzy
            extra_args: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            distro: humble
            extra_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Prepare macOS build environment
        if: matrix.os == 'macos-latest'
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --strip
            --features pyo3/extension-module,${{ matrix.distro }}
            --no-default-features
            --out dist
            ${{ matrix.extra_args }}
          working-directory: crates/hiroz-py
          manylinux: auto

      - name: Rename wheel to include distro as build tag
        shell: bash
        run: |
          # Insert the distro as the PEP 427 build tag (field 3): 0{distro}
          # e.g. hiroz_py-0.1.0-cp311-... → hiroz_py-0.1.0-0jazzy-cp311-...
          # Build tags must start with a digit. The distribution name is unchanged
          # so pip can match it against the .dist-info directory inside the wheel.
          # sudo needed: manylinux container builds as root, wheel is root-owned.
          for whl in crates/hiroz-py/dist/*.whl; do
            dir=$(dirname "$whl")
            base=$(basename "${whl%.whl}")
            name="${base%%-*}"
            rest="${base#*-}"
            version="${rest%%-*}"
            tags="${rest#*-}"
            sudo mv "$whl" "$dir/${name}-${version}-0${{ matrix.distro }}-${tags}.whl"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiroz-py-${{ matrix.distro }}-${{ matrix.target }}
          path: crates/hiroz-py/dist/*

  build-binaries:
    name: Build ${{ matrix.bin }} (${{ matrix.label }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # hu (hiroz-union) — distro-agnostic, one binary per platform
          # `web-plugins` is deliberate: docs/tools/hu.md documents `hu web`,
          # and a default-feature build accepts the subcommand then refuses it
          # at run time. It implies wasm-plugins, so nothing is lost.
          - bin: hu
            package: hiroz-union
            features: "web-plugins"
            artifact: bin-hu-x86_64-linux
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # `web-plugins` is deliberate: docs/tools/hu.md documents `hu web`,
          # and a default-feature build accepts the subcommand then refuses it
          # at run time. It implies wasm-plugins, so nothing is lost.
          - bin: hu
            package: hiroz-union
            features: "web-plugins"
            artifact: bin-hu-aarch64-linux
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # `web-plugins` is deliberate: docs/tools/hu.md documents `hu web`,
          # and a default-feature build accepts the subcommand then refuses it
          # at run time. It implies wasm-plugins, so nothing is lost.
          - bin: hu
            package: hiroz-union
            features: "web-plugins"
            artifact: bin-hu-aarch64-macos
            target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-wasip2 builds the hu plugins. They are platform-independent,
          # so only the primary leg (below) actually packages them.
          targets: wasm32-wasip2

      - name: Install Rust target (Linux cross-compile only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compile tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          pip install ziglang
      - name: Install cargo-zigbuild (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binary (aarch64 Linux via zigbuild)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: >-
          cargo zigbuild --release
          --bin ${{ matrix.bin }}
          --package ${{ matrix.package }}
          ${{ matrix.features != '' && format('--features {0} --no-default-features', matrix.features) || '' }}
          --target ${{ matrix.target }}

      - name: Build binary (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          cargo build --release \
            --bin ${{ matrix.bin }} \
            --package ${{ matrix.package }} \
            ${{ matrix.features != '' && format('--features {0} --no-default-features', matrix.features) || '' }} \
            --target ${{ matrix.target }}

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.113.1"

      # HU_VERSION identifies the RELEASE (`0.2.0-rc1`); HU_CORE identifies the
      # ASSETS (`0.2.0`). They differ only for a pre-release, because
      # build-hu-release.nu names every file for the crate version — an rc ships
      # the same crate as the release it rehearses. Using one string for both is
      # what broke the first pre-release on the other channel.
      - name: Derive version from tag
        shell: bash
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          echo "HU_VERSION=$V"      >> "$GITHUB_ENV"
          echo "HU_CORE=${V%%-*}"   >> "$GITHUB_ENV"
          echo ">>> tag=$GITHUB_REF_NAME version=$V core=${V%%-*}"

      - name: Package binary
        shell: bash
        run: |
          # The shared script, never an ad-hoc `cp`: the tarball name and
          # contents are the contract install-hu.sh reads. --binary-from packages
          # what the cross legs already built; --no-sums because SHA256SUMS is
          # assembled once, in the release job, over every leg's assets.
          #
          # --version arms the tag-vs-crate guard (build-hu-release.nu:69-77),
          # so a tag that disagrees with the crate fails here instead of
          # shipping a tarball whose name lies about its contents. The guard
          # compares only the CORE version, so an `-rc<N>` suffix is legal.
          nu scripts/build-hu-release.nu \
            --binary-only \
            --version "$HU_VERSION" \
            --binary-from "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            --target "${{ matrix.target }}" \
            --no-sums \
            --out bin-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin-dist/*

  build-hu-plugins:
    name: Build hu WASM plugins
    runs-on: ubuntu-latest
    # `hu meter` and `hu monitor` are NOT in the hu binary — they are WASM
    # components. Without this job the release ships a hu that cannot run any
    # documented `hu meter`/`hu monitor` command.
    #
    # wasm32-wasip2 output is platform-independent, so this runs on exactly one
    # leg. Building it in the per-target matrix would have three legs racing to
    # upload the same asset name.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.113.1"

      # HU_VERSION identifies the RELEASE (`0.2.0-rc1`); HU_CORE identifies the
      # ASSETS (`0.2.0`). build-hu-release.nu names every file for the crate
      # version, so a pre-release tag produces core-named assets by design.
      # Deriving one string and using it for both is what made the first
      # pre-release on the other channel build cleanly and then fail verifying
      # filenames that by design never exist.
      - name: Derive version from tag
        shell: bash
        run: |
          set -eu
          V="${GITHUB_REF_NAME#v}"
          echo "HU_VERSION=$V"      >> "$GITHUB_ENV"
          echo "HU_CORE=${V%%-*}"   >> "$GITHUB_ENV"
          echo ">>> tag=$GITHUB_REF_NAME version=$V core=${V%%-*}"

      # build-hu-release.nu validates each .wasm by loading it as a component
      # through `hu plugin validate`, which needs a HOST-NATIVE hu. This leg is
      # x86_64 Linux, so it can build one — and it must, because this is the
      # only job that publishes the .wasm files. Without it the channel that
      # ships the plugins never once compiles them as components.
      #
      # Default features are enough (`wasm-plugins` provides `plugin validate`)
      # and this binary is never packaged: the released hu comes from the
      # build-binaries matrix.
      - name: Build a host-native hu for plugin validation
        shell: bash
        run: cargo build --release --bin hu --package hiroz-union

      - name: Build plugins and index
        shell: bash
        run: |
          # The single packaging script every release platform calls, so they
          # cannot drift in what they ship.
          # --version arms the tag-vs-crate guard (build-hu-release.nu:69-77);
          # it compares only the CORE version, so `-rc<N>` is legal.
          # --no-sums: SHA256SUMS is assembled once in the release job over
          # every asset. A per-job file here would cover only the plugins and
          # verify clean while saying nothing about the binary.
          nu scripts/build-hu-release.nu --plugins-only --version "$HU_VERSION" --no-sums --out hu-dist

      - name: Verify the plugin artifact set
        shell: bash
        run: |
          set -e
          # HU_CORE, not HU_VERSION: the assets are named for the crate.
          for f in "hu_meter-$HU_CORE.wasm" \
                   "hu_monitor-$HU_CORE.wasm" \
                   "hu-plugins-$HU_CORE.tar.gz" \
                   "hu-plugins-$HU_CORE.json"; do
            test -s "hu-dist/$f" || { echo "missing or empty: hu-dist/$f"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-hu-plugins
          path: hu-dist/*

  build-go-libs:
    name: Build libhiroz (${{ matrix.distro }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            distro: jazzy
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            distro: humble
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            distro: jazzy
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            distro: humble
          - target: aarch64-apple-darwin
            os: macos-latest
            distro: jazzy
          - target: aarch64-apple-darwin
            os: macos-latest
            distro: humble

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target (Linux cross-compile only)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.os == 'ubuntu-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compile tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.os == 'ubuntu-latest'
        run: |
          pip install ziglang
      - name: Install cargo-zigbuild (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build libhiroz (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu' || matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          cargo build --release \
            --features ffi,${{ matrix.distro }} \
            --no-default-features \
            --target ${{ matrix.target }} \
            -p hiroz

      - name: Build libhiroz (aarch64 Linux via zigbuild)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.os == 'ubuntu-latest'
        run: >-
          cargo zigbuild --release
          --features ffi,${{ matrix.distro }}
          --no-default-features
          --target ${{ matrix.target }}
          -p hiroz

      - name: Package library
        shell: bash
        run: |
          mkdir -p go-dist
          src="target/${{ matrix.target }}/release"
          name="libhiroz-${{ matrix.distro }}-${{ matrix.target }}"
          if [ -f "$src/libhiroz.a" ]; then
            cp "$src/libhiroz.a" "go-dist/${name}.a"
          fi
          if [ -f "$src/libhiroz.dylib" ]; then
            cp "$src/libhiroz.dylib" "go-dist/${name}.dylib"
          fi
          if [ -f "$src/libhiroz.so" ]; then
            cp "$src/libhiroz.so" "go-dist/${name}.so"
          fi
          cp crates/hiroz-go/hiroz/hiroz_ffi.h "go-dist/hiroz_ffi.h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhiroz-${{ matrix.distro }}-${{ matrix.target }}
          path: go-dist/*

  smoke-test-python:
    name: Smoke test Python wheel
    needs: [build-msgs, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download hiroz-msgs-py
        uses: actions/download-artifact@v4
        with:
          name: hiroz-msgs-py-dist
          path: dist/

      - name: Download hiroz-py wheel (jazzy, x86_64)
        uses: actions/download-artifact@v4
        with:
          name: hiroz-py-jazzy-x86_64-unknown-linux-gnu
          path: dist/

      - name: Install wheels into venv
        run: |
          python -m venv .venv
          # Install msgs first so it is fully initialized before hiroz_py imports it
          .venv/bin/pip install dist/hiroz_msgs_py-*.whl
          .venv/bin/pip install "dist/hiroz_py-"*0jazzy*.whl

      - name: Import test
        run: .venv/bin/python -c "import hiroz_py; print('hiroz_py import ok')"

  smoke-test-binaries:
    name: Smoke test binaries (${{ matrix.target }})
    needs: [build-binaries, build-hu-plugins]
    runs-on: ${{ matrix.os }}
    # One leg per platform whose tarball the release publishes and whose host
    # this workflow can run on. Until this was a matrix the macOS tarball was
    # built, packaged and published without ever being unpacked or executed by
    # anything — a broken macOS artifact would have shipped green. The
    # aarch64-linux tarball has no leg here because no GitHub-hosted runner can
    # execute it; it stays unexercised by this workflow, deliberately and
    # visibly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bin-hu-x86_64-linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact: bin-hu-aarch64-macos
            target: aarch64-apple-darwin
    steps:
      # MUST be first. `actions/checkout` cleans the working directory, so a
      # checkout after the downloads deletes the `dist/` they just populated
      # and the next step dies on `cd: dist: No such file or directory`. This
      # job had never run -- release.yml triggers only on a `v*` tag -- so the
      # ordering was wrong from the day it was written and nothing could say so.
      - uses: actions/checkout@v4

      - name: Download hu binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      # The .wasm plugins are wasm32-wasip2 and platform-independent, so both
      # legs consume the single artifact the one plugins job produced.
      - name: Download hu plugins
        uses: actions/download-artifact@v4
        with:
          name: bin-hu-plugins
          path: dist/

      # Assemble the same SHA256SUMS the release job will, so this test
      # installs from artifacts shaped exactly like the published ones.
      #
      # Written for both hosts. macOS ships neither `sha256sum` nor GNU find's
      # `-printf`, so the Linux-only spellings this step used to carry would
      # have failed the macOS leg on its first line — before testing anything
      # about the artifact.
      - name: Assemble SHA256SUMS
        shell: bash
        run: scripts/ci/write-sha256sums.sh dist

      # The real question is not "does the binary start" but "can a user who
      # downloaded this release install it the documented way and then run
      # `hu meter`". So this uses the actual installer rather than hand-placing
      # files: it is the only thing that exercises the artifact *shape*, which
      # is where this channel was broken — it shipped a bare ELF while the
      # installer expects a tarball.
      #
      # No target is passed: install-hu.sh's own detect_target must pick this
      # host's tarball out of dist/. On the macOS leg that is the only thing
      # that exercises the Darwin/arm64 arm of that function against a real
      # release layout.
      - name: Install from the release artifacts, as a user would
        shell: bash
        run: |
          set -e
          HUHOME="$RUNNER_TEMP/huhome"
          mkdir -p "$HUHOME"
          HOME="$HUHOME" HU_PREFIX="$HUHOME/.local" sh scripts/install-hu.sh --offline dist
          unset HU_PLUGIN_PATH
          HOME="$HUHOME" "$HUHOME/.local/bin/hu" --version
          out="$(HOME="$HUHOME" "$HUHOME/.local/bin/hu" plugin list)"
          echo "$out"
          echo "$out" | grep -q meter   || { echo "FAIL: meter not discovered"; exit 1; }
          echo "$out" | grep -q monitor || { echo "FAIL: monitor not discovered"; exit 1; }

      # Prove the refusal fires. A checksum check that has never rejected
      # anything is unverified, not safe.
      - name: A corrupted asset must be refused
        shell: bash
        run: |
          set -e
          # Corrupt THIS leg's tarball. Corrupting a fixed target's would leave
          # the macOS leg installing an intact tarball and passing a test that
          # proved nothing.
          tarball=$(echo dist/hu-*-${{ matrix.target }}.tar.gz)
          test -f "$tarball" || { echo "FAIL: no tarball for ${{ matrix.target }}"; exit 1; }
          printf 'X' | dd of="$tarball" bs=1 seek=100 conv=notrunc 2>/dev/null
          HUHOME="$RUNNER_TEMP/huhome-bad"
          mkdir -p "$HUHOME"
          if HOME="$HUHOME" HU_PREFIX="$HUHOME/.local" sh scripts/install-hu.sh --offline dist; then
            echo "FAIL: installer accepted a corrupted tarball"; exit 1
          fi
          test ! -e "$HUHOME/.local/bin/hu" || { echo "FAIL: installed despite refusing"; exit 1; }
          echo "ok — corrupted asset refused, nothing installed"

  smoke-test-go:
    name: Smoke test Go library
    needs: [build-go-libs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download libhiroz (jazzy, x86_64)
        uses: actions/download-artifact@v4
        with:
          name: libhiroz-jazzy-x86_64-unknown-linux-gnu
          path: dist/

      - name: Verify archive and header
        run: |
          ar t dist/libhiroz-jazzy-x86_64-unknown-linux-gnu.a | head -5
          test -f dist/hiroz_ffi.h
          echo "Go library artifact ok"

      - name: Place library for CGO build
        run: |
          mkdir -p target/release
          cp dist/libhiroz-jazzy-x86_64-unknown-linux-gnu.a target/release/libhiroz.a

      - name: Build Go package (CGO link test)
        working-directory: crates/hiroz-go
        run: go build ./hiroz/...

  release:
    name: Create GitHub Release
    needs: [smoke-test-python, smoke-test-binaries, smoke-test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Download hiroz-msgs-py artifacts
        uses: actions/download-artifact@v4
        with:
          name: hiroz-msgs-py-dist
          path: dist/

      - name: Download hiroz-py wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hiroz-py-*
          path: dist/
          merge-multiple: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true

      - name: Download libhiroz artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libhiroz-*
          path: dist/
          merge-multiple: true

      # docs/tools/hu-install.md points readers at this URL, and nothing put the
      # installer there. Staged BEFORE SHA256SUMS is assembled, so the checksum
      # file covers it -- that step lists whatever is in dist/ when it runs, and
      # an unlisted asset verifies clean while saying nothing about itself.
      - name: Stage the installer as a release asset
        shell: bash
        run: |
          set -e
          test -f scripts/install-hu.sh || {
            echo "FAIL: scripts/install-hu.sh missing from the checkout"; exit 1; }
          # Parse-only. A syntactically broken installer is worse than an
          # absent one: `curl … | sh` executes it up to the parse error, so a
          # partial run can leave a half-installed prefix behind. This costs
          # nothing and cannot pass a file that would not parse on the reader's
          # machine.
          sh -n scripts/install-hu.sh
          mkdir -p dist
          cp scripts/install-hu.sh dist/install-hu.sh
          chmod 0755 dist/install-hu.sh
          echo "staged dist/install-hu.sh ($(wc -c < dist/install-hu.sh) bytes)"

      # One checksum file over every asset, generated here rather than per
      # job. Per-job files were the bug: the plugins job emitted a SHA256SUMS
      # covering only the plugins, so `sha256sum -c` passed while never
      # checking the binary, and install-hu.sh refused the binary as unlisted.
      - name: Assemble SHA256SUMS over the complete asset set
        shell: bash
        run: |
          set -e
          scripts/ci/write-sha256sums.sh dist
          cd dist
          # The assembly is shared; these two assertions are not. A release with
          # no hu tarball, or with the installer the docs point at left
          # uncovered, is the defect this step replaces.
          grep -q 'hu-.*\.tar\.gz' SHA256SUMS \
            || { echo "FAIL: no hu tarball covered by SHA256SUMS"; exit 1; }
          grep -q ' install-hu\.sh$' SHA256SUMS \
            || { echo "FAIL: install-hu.sh is not covered by SHA256SUMS"; exit 1; }

      # Draft, then promoted by `publish-release`, then withdrawn by
      # `withdraw-release` if the post-publish checks fail. Publish-then-verify
      # rather than verify-then-publish because GitHub does not serve draft
      # assets for a download test. `prerelease` comes from the tag shape, so a
      # rehearsal tag never takes the "Latest" badge.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/**
          # Semver: everything after the first `-` IS the pre-release
          # identifier, so a hyphen is the whole test. Enumerating rc/alpha/beta
          # is both longer and narrower -- it would publish `v0.2.0-smoke-test`
          # as a full release and hand it the Latest badge.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Promote the draft so the public download path exists. Everything below
  # installs from that URL anonymously, which is the only way to exercise URL
  # construction -- the offline path never builds one, which is how an
  # installer that fetched a path the host did not serve reached a release.
  publish-release:
    name: Publish the draft release
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false
          echo "published ${{ github.ref_name }}"

  smoke-test-release-install:
    name: Smoke test install from release URL
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir release-dist
          gh release download "$TAG" --repo "$REPO" \
            --pattern "hiroz_msgs_py-*.whl" \
            --pattern "*0jazzy*x86_64*linux*.whl" \
            --dir release-dist/
          .venv/bin/pip install release-dist/hiroz_msgs_py-*.whl
          .venv/bin/pip install release-dist/*0jazzy*x86_64*linux*.whl

      - name: Import test
        run: .venv/bin/python -c "import hiroz_py; print('hiroz_py install-from-release ok')"

      - uses: actions/checkout@v4

      # Install `hu` from the live release URLs, the way a reader of
      # docs/tools/hu-install.md does. This is the only test that exercises
      # URL construction — the installer once built asset paths this host does
      # not serve, and no offline test could catch that because the offline
      # path never builds a URL.
      #
      # No credential: this repo is public, and requiring one here would hide
      # a regression where the installer starts demanding a token it does not
      # need.
      - name: Install hu from the published release
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          # VER is the RELEASE identity and belongs in the download path and in
          # `--version`, which install-hu.sh itself splits into a core version
          # for the filenames. CORE is what the BINARY reports, because it is
          # built from the crate: an rc tag v0.2.0-rc1 produces a hu that prints
          # `hu 0.2.0`. Asserting on VER here fails every pre-release.
          VER="${TAG#v}"
          CORE="${VER%%-*}"
          HUHOME="$RUNNER_TEMP/hu-from-release"
          mkdir -p "$HUHOME"
          # GitHub serves release assets from a stable path shape,
          # so only the base directory differs. That is exactly what
          # HU_RELEASE_BASE overrides.
          export HU_RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          # Download-then-run, exactly as docs/tools/hu-install.md instructs,
          # against the published asset rather than the repo copy.
          # `&&` propagates curl's status, so a 404 stops here. Piping instead
          # would not: a pipeline's status is its last command's, so `sh` would
          # read empty stdin, exit 0, and pass this step having installed
          # nothing. Measured both ways -- rc=22 with the `&&`, rc=0 with a pipe.
          cd "$RUNNER_TEMP"
          env -u HU_RELEASE_TOKEN HOME="$HUHOME" HU_PREFIX="$HUHOME/.local" \
            bash -c "curl -fsSL '$HU_RELEASE_BASE/install-hu.sh' -o install-hu.sh \
              && HU_RELEASE_BASE='$HU_RELEASE_BASE' HU_VERSION='$VER' sh install-hu.sh"
          cd "$GITHUB_WORKSPACE"
          unset HU_PLUGIN_PATH || true
          got=$(HOME="$HUHOME" "$HUHOME/.local/bin/hu" --version)
          echo "installed: $got"
          test "$got" = "hu $CORE" || { echo "FAIL: expected 'hu $CORE', got '$got'"; exit 1; }
          out=$(HOME="$HUHOME" "$HUHOME/.local/bin/hu" plugin list)
          echo "$out"
          echo "$out" | grep -q meter   || { echo "FAIL: meter missing"; exit 1; }
          echo "$out" | grep -q monitor || { echo "FAIL: monitor missing"; exit 1; }
          echo "HUHOME=$HUHOME" >> "$GITHUB_ENV"
          echo "HU_RELEASE_BASE=$HU_RELEASE_BASE" >> "$GITHUB_ENV"

      # The docs' first instruction is `curl -fsSL <base>/install-hu.sh | sh`.
      # Publishing the file is one claim; the URL resolving is another, and
      # only fetching it from the live release tests the second. Every release
      # before this one served a 404 here.
      - name: The documented installer URL must serve the installer
        run: |
          set -e
          curl -fsSL "$HU_RELEASE_BASE/install-hu.sh" -o fetched-install-hu.sh
          # Parse it as the reader's shell would. `curl … | sh` gives no
          # opportunity to inspect first, so a broken asset runs partially.
          sh -n fetched-install-hu.sh
          # And it must be the file this tag was cut from, not a stale asset
          # carried over from an earlier release.
          diff -u scripts/install-hu.sh fetched-install-hu.sh \
            || { echo "FAIL: published install-hu.sh differs from the tagged source"; exit 1; }
          echo "ok — the documented one-liner URL serves this tag's installer"

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.113.1"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # From the source checkout, not the artifact: `hu` cannot generate its own
      # traffic, because no release ships message definitions (#309, G2). With
      # only `hu router` the suite measures an empty graph and decays into an
      # exit-status check -- which a truncated plugin passes.
      - name: Build the traffic fixture from source
        run: cargo build --release --example z_pubsub -p hiroz

      - name: Reproduce the documented commands against the published release
        run: |
          set -eu
          unset HU_PLUGIN_PATH || true
          HOME="$HUHOME" "$HUHOME/.local/bin/hu" router > router.log 2>&1 &
          ROUTER_PID=$!
          sleep 5
          # A router that died on startup shows up as a dozen unrelated
          # measurement failures, so assert on it directly.
          kill -0 "$ROUTER_PID" 2>/dev/null || {
            echo "FAIL: router died on startup"; tail -20 router.log; exit 1; }
          # Exit status must not pass through a pipe, and the log must be
          # printed whichever way this goes.
          set +e
          nu scripts/test-hu-docs-repro.nu \
            --home "$HUHOME" \
            --publisher "$PWD/target/release/examples/z_pubsub" \
            --require-traffic > repro.log 2>&1
          rc=$?
          set -e
          cat repro.log
          kill "$ROUTER_PID" 2>/dev/null || true
          test "$rc" -eq 0 || {
            echo "FAIL: the published release does not reproduce its own docs"; exit 1; }

  # If the published release cannot install itself, or cannot reproduce its own
  # documentation, put it back in the drawer. A draft is invisible to everyone
  # without push access and keeps its assets, so the run can be diagnosed from
  # exactly what shipped. The tag survives -- withdrawing a release does not
  # delete it -- so the fix is a new tag rather than a rewritten one.
  #
  # This is the half of "draft first" that is actually reachable, given that
  # GitHub will not serve draft assets for the download test above.
  withdraw-release:
    name: Withdraw the release if verification failed
    needs: [publish-release, smoke-test-release-install]
    # NOT `failure()`: that is true when ANY ancestor fails, and this job's
    # ancestors reach back to build-binaries. A failed build skips release and
    # publish-release, then this job would still run and try to withdraw a
    # release that was never created -- going red with a caption implying a bad
    # release is live. Withdraw only what publish-release actually published.
    if: ${{ always()
            && needs.publish-release.result == 'success'
            && needs.smoke-test-release-install.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Return the release to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=true
          echo "WITHDRAWN: ${{ github.ref_name }} is a draft again — it did not verify."
          echo "The tag still exists. Fix, then cut a new tag; do not move this one."

  publish-crates:
    name: Publish core crates to crates.io
    needs: [smoke-test-release-install]
    # A pre-release tag rehearses the pipeline; it must not publish to
    # crates.io. crates.io versions come from the crate manifests, not from the
    # tag, so an rc tag would try to publish the SAME version the real release
    # already published and end the run red on a rehearsal that otherwise
    # passed. Skipping keeps the rc a clean rehearsal signal.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish core crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace -j4
