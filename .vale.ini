StylesPath = .vale/styles
Vocab = hiroz

MinAlertLevel = warning

# Spelling only. The write-good Passive, Weasel and TooWordy rules came here
# from ros-z and flagged 79 spots in the existing docs. Passive voice is
# frequently the correct choice in reference prose, so those three are a
# style opinion rather than a defect. Spelling is the rule with an objective
# answer, so it is the one CI blocks on.
[*.md]
BasedOnStyles = Vale
Vale.Terms = NO
