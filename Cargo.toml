[workspace.package]
version = "0.2.0"
edition = "2024"
description = "Native Rust ROS 2 implementation using Zenoh"
homepage = "https://github.com/ZettaScaleLabs/hiroz"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ZettaScaleLabs/hiroz"

[workspace]
resolver = "2"
members = [
  "crates/hiroz",
  "crates/hiroz-cdr",
  "crates/hiroz-codegen",
  "crates/hiroz-derive",
  "crates/hiroz-protocol",
  "crates/hiroz-py",
  "crates/rmw-zenoh-rs",
  "crates/hiroz-schema",
  "crates/hiroz-msgs",
  "crates/hiroz-tests",
  "crates/hiroz-union",
  "crates/hiroz/examples/protobuf_demo",
]
# WASM plugins require --target wasm32-wasip2 and cannot be compiled as part of a
# native workspace build. Build them explicitly:
#   cargo build -p hu-meter --target wasm32-wasip2 --manifest-path crates/hiroz-union/plugins/hu-meter/Cargo.toml
exclude = [
  "crates/hiroz-union/plugins/hu-meter",
  "crates/hiroz-union/plugins/hu-monitor",
  "crates/hiroz-union/plugins/hu-plugin-template",
]
default-members = ["crates/hiroz", "crates/hiroz-codegen"]
# Note: protobuf_demo is an advanced example demonstrating protobuf serialization
# Note: Go packages are in:
# - crates/hiroz-codegen-go/ (code generator)
# - crates/hiroz-go/ (runtime library)

[workspace.dependencies]
# Workspace members
hiroz = { version = "0.2.0", path = "crates/hiroz" }
hiroz-codegen = { version = "0.2.0", path = "crates/hiroz-codegen" }
hiroz-protocol = { version = "0.2.0", path = "crates/hiroz-protocol" }
rmw-zenoh-rs = { version = "0.2.0", path = "crates/rmw-zenoh-rs" }
hiroz-schema = { version = "0.2.0", path = "crates/hiroz-schema" }

# Serialization
hiroz-cdr = { version = "0.2.0", path = "crates/hiroz-cdr" }
hiroz-derive = { version = "0.2.0", path = "crates/hiroz-derive" }
serde = "1.0.219"
serde_bytes = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"

# Zenoh
zenoh = { version = "1.9.0", default-features = false, features = [
  "transport_tcp",
  "transport_serial",
] }
zenoh-ext = { version = "1.9.0", features = ["unstable"] }
zenoh-buffers = { version = "1.9.0" }

# CLI
clap = "4.5.45"

# Async/sync primitives
flume = "0.11.1"
parking_lot = "0.12.4"
tokio = "1.47.1"
tokio-util = "0.7"
event-listener = "5"

# Utilities
tracing = "0.1.41"
thiserror = "2.0"
strum = "0.27.2"
sha2 = "0.10.9"
slab = "0.4.11"
byteorder = "1.3"
csv = "1.3.1"
json5 = "0.4.1"
once_cell = "1.19"
hex = "0.4"

# FFI
cxx = "1.0.168"

# Python
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }

# Code generation
quote = "1.0"
syn = "2.0"
proc-macro2 = "1.0"
anyhow = "1.0"
glob = "0.3"

# Protobuf (optional)
prost = "0.14"
prost-build = "0.14"

# Derive macros
smart-default = "0.7"
serde-big-array = "0.5"

# Build dependencies
bindgen = "0.72.0"
cxx-build = "1.0.168"

[profile.opt]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

# zenoh-buffers, with ZSlice::as_mut_slice / ZBuf::as_mut_slice added on top of
# the 1.9.0 tag. hiroz::ZBuf::as_mut_slice delegates to it, which is what lets a
# publisher reuse one payload buffer instead of allocating per send. Upstream as
# a PR to eclipse-zenoh/zenoh; this pin goes away when it lands in a release.
# See circle/hiroz-bench#38.
[patch.crates-io]
#
# Pinned to a rev, not a branch: a [patch.crates-io] entry is the worst place for
# a dependency that can move under you, because nothing about the build changes
# when it does. The forge is tailnet-only and the repo is private, so a build
# host that cannot reach it overrides this line to a local checkout of the same
# commit — asserting the rev first, since a patch that silently does not apply is
# indistinguishable from a null result.
zenoh-buffers = { git = "https://forgejo.yuyuan.dev/circle/zenoh.git", rev = "337adf0dc" }
