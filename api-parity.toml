# API parity across entities and bindings, as of v0.2.2.
#
# One row per builder option. One cell per binding: rust, python, c, go.
# A cell has one of three states:
#   present  the binding offers the option. `symbol` names the Rust method, Python method, C symbol or Go method.
#   absent   the binding does not offer the option. `reason` says why.
#   planned  the binding does not offer the option yet. `reason` says why and `release` names the release that adds it.
#
# The rule: an option that ships as a public Rust `with_*` builder method has a row here. The row states, for each binding, whether it offers the option.
# A pull request that adds a public `with_*` builder method adds its row in the same change.
#
# crates/hiroz-tests/tests/api_parity.rs checks this file:
#   - every row and cell has the required fields
#   - every public `with_*` method of a builder type found by the scan of crates/hiroz/src has a row (see Limits)
#   - a `present` Rust cell names a public method of a builder type found by that scan
#   - each identifier of a `present` Python, C or Go symbol is defined in the source of that binding, outside comments and strings
#     A definition is a `fn`, `struct`, `enum`, `union`, `trait`, `type`, `const` or `static` item, a parameter `name: Type` of a `fn`, a field `name: Type` of a `struct` or `union`, a PyO3 `signature` parameter or rename attribute (Python only), or a Go `func` or `type` line.
#     A call, a struct literal, a `let` binding, a closure parameter or a format argument does not count.
#     The check does not tie a method to its type or a parameter to its function: a parameter or field name counts when any function or struct of the binding has it.
#     It does not check enum variants, `impl` blocks, macro-generated items, Go struct fields or Go parameters.
#
# Limits of the file:
#   - It has no entity of its own for parameters or lifecycle nodes. Only their builder options appear, under `node`. It has no rows for events.
#   - The scan reads only `impl` headers that start a line, and the one macro `impl_with_type_info!`. A `with_*` method that another macro or an indented `impl` header defines is not found, so the test does not demand a row for it.
#   - It demands rows only for Rust `with_*` builder methods. An option that exists only as a C field, a Python keyword argument or a Go method needs no row.
#   - It does not compare behaviour. A `present` cell says that each identifier of the symbol is defined in the binding, as above. It does not say that the symbol behaves like the Rust one, and the check does not run the binding.
#   - The Rust check covers builder types whose name ends in `Builder` and that map to an entity.
#     `RouterConfigBuilder` and `SessionConfigBuilder` configure zenoh sessions and are not entities, so they have no rows.
#   - Python symbols are `Class.method`. The Python builders take options as methods, and the node takes options as keyword arguments.
#   - C symbols are `Struct.field` for the context and node configuration structs, and function names for the rest.
#   - Go symbols are `Type.Method`.

