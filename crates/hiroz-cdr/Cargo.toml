[package]
name = "hiroz-cdr"
version.workspace = true
edition.workspace = true
description = "CDR serialization for hiroz"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ros2", "zenoh", "cdr", "serialization", "robotics"]
categories = ["encoding", "network-programming"]

[dependencies]
serde = { workspace = true }
byteorder = { workspace = true }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
zenoh-buffers = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
proptest = "1"

# setrlimit(RLIMIT_AS) in the hostile-length child process. The test file and this dependency are Linux-only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.29", features = ["resource"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
