[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# The pin gate runs 25 receives of 32 MiB, about 11 s each (about 277 s in total), one after the other.
# The timeout of 120 s x 5 (600 s) covers that with margin.
# The test is `#[ignore]`d. CI does not run it. See the profile `pin-timing` below.
[[profile.default.overrides]]
filter = 'test(=pinned_32mib_main_thread_receive_is_not_slower_than_unpinned)'
slow-timeout = { period = "120s", terminate-after = 5 }

# Profile for the opt-in pin timing gate. Run it on a quiet host only (load average below 0.6):
#   cargo nextest run -p hiroz-tests --features ros-msgs,jazzy --profile pin-timing \
#       --run-ignored only -E 'test(=pinned_32mib_main_thread_receive_is_not_slower_than_unpinned)'
# One test thread, so nothing else of this run shares the host with the measurement.
[profile.pin-timing]
test-threads = 1

# Profile for interop tests that spawn ros2 CLI subprocesses.
# Each test owns its own TestRouter port so all 14 tests run in parallel.
# The larger slow-timeout budget accommodates subprocess startup on CI runners.
[profile.interop]
slow-timeout = { period = "60s", terminate-after = 2 }
test-threads = 8
# These tests drive external `ros2` processes, so one environment problem is not
# evidence about the rest of the suite. Cancelling on the first failure hid that:
# a single failing test left 108 of 154 unrun, and the leg then reported far less
# than a green run would. Run them all and report every failure.
fail-fast = false
