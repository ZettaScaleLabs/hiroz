[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

# Profile for interop tests that spawn ros2 CLI subprocesses.
# Each test owns its own TestRouter port so all 14 tests run in parallel.
# The larger slow-timeout budget accommodates subprocess startup on CI runners.
# test-threads lowered from 8: real ros2/rclcpp subprocesses are spawned by
# tests across demo_nodes.rs, parameter_interop.rs, pubsub_interop.rs,
# service_interop.rs, and type_description_interop.rs, and too many
# concurrent spawns cause discovery-latency failures/timeouts (observed on
# both CI and whippet) -- not just in the demo_nodes.rs cluster the
# rcl-interop test-group below targets specifically.
[profile.interop]
slow-timeout = { period = "100s", terminate-after = 2 }
test-threads = 4

# nextest runs each test in its own process, so serial_test's in-process
# static Mutex cannot serialize tests across process boundaries -- it is a
# no-op under nextest. Use nextest's own test-groups instead.
#
# Even with test-threads=4, tests in demo_nodes.rs/parameter_interop.rs that
# spawn a real ros2/rclcpp subprocess kept intermittently missing their
# discovery-latency deadlines (widened twice, still not converging) because
# other RCL-spawning tests in pubsub_interop.rs/service_interop.rs/
# type_description_interop.rs are not in the same serialization group and
# can still run concurrently with them. Serialize whole test *binaries*
# instead of hand-enumerating individual RCL-spawning test names, since
# every one of these 5 binaries has at least one such test and getting the
# name list wrong silently reintroduces the contention.
[test-groups]
rcl-interop = { max-threads = 1 }

[[profile.interop.overrides]]
filter = 'binary_id(hiroz-tests::demo_nodes) | binary_id(hiroz-tests::parameter_interop) | binary_id(hiroz-tests::pubsub_interop) | binary_id(hiroz-tests::service_interop) | binary_id(hiroz-tests::type_description_interop)'
test-group = 'rcl-interop'
